name: LUNA RAUM Atelier v3
on:
  push:
    branches: [main]
    paths: ['tools/v3/**', '.github/workflows/atelier-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: luna-raum-atelier-v3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build single-file upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Martin-Hausleitner/Luna-Raum/actions/artifacts/10340316676/zip > /tmp/v2.zip
          mkdir candidate
          unzip -q /tmp/v2.zip -d candidate
          python3 tools/v3/upgrade.py candidate
          node --check candidate/runtime.js
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Existing planning workflows regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory candidate >/tmp/luna-server.log 2>&1 &
          xvfb-run -a -s '-screen 0 1920x1200x24' python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import subprocess
          with sync_playwright() as p:
            exe=p.chromium.executable_path
          subprocess.run(['python3','candidate/qa_v3_legacy.py','--url','http://127.0.0.1:8765/Luna-Raum.html','--browser',exe,'--software-gpu','--require-gpu','--out','candidate/qa/v3-regression'],check=True)
          PY
      - name: Real pixels and new workflows
        if: always()
        run: |
          xvfb-run -a -s '-screen 0 1920x1200x24' python3 candidate/qa_studio.py http://127.0.0.1:8765/Luna-Raum.html candidate/qa/atelier
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Luna-Raum-Atelier-v3-candidate
          path: candidate/
          retention-days: 7
          if-no-files-found: error
