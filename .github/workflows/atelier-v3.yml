name: LUNA RAUM Atelier v3
on:
  push:
    branches: [main]
    paths: ['tools/v3/**', '.github/workflows/atelier-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: luna-raum-atelier-v3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Recover verified source candidate and build new single file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Martin-Hausleitner/Luna-Raum/actions/artifacts/10340316676/zip > /tmp/v2.zip
          mkdir candidate
          unzip -q /tmp/v2.zip -d candidate
          python3 tools/v3/upgrade.py candidate
          cp tools/v3/qa_studio.py candidate/qa_studio.py
          node --check candidate/runtime.js
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Existing workflows regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory candidate >/tmp/luna-server.log 2>&1 &
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import subprocess
          with sync_playwright() as p:
            exe=p.chromium.executable_path
          subprocess.run(['python3','candidate/qa_v3_legacy.py','--url','http://127.0.0.1:8765/Luna-Raum.html','--browser',exe,'--software-gpu','--require-gpu','--out','candidate/qa/v3-regression'],check=True)
          PY
      - name: Visual pixels and new workflows
        if: always()
        run: |
          python3 candidate/qa_studio.py http://127.0.0.1:8765/Luna-Raum.html candidate/qa/atelier
      - name: Compare WebGPU presentation backends
        if: always()
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import pathlib,json
          out=pathlib.Path('candidate/qa/backend');out.mkdir(parents=True,exist_ok=True)
          with sync_playwright() as p:
            for i,extra in enumerate([['--use-vulkan=swiftshader'],[],['--use-angle=vulkan']]):
              b=p.chromium.launch(executable_path=p.chromium.executable_path,headless=True,args=['--enable-unsafe-webgpu','--use-angle=swiftshader','--enable-features=Vulkan','--disable-vulkan-surface']+extra)
              page=b.new_page(viewport={'width':1600,'height':1000});page.goto('http://127.0.0.1:8765/base.html');page.wait_for_timeout(2200);page.screenshot(path=str(out/f'base-{i}.png'))
              print('BASE_BACKEND',i,page.evaluate('({ready:Luna.gpu.ready,reason:Luna.gpu.reason,errors:Luna.gpu.stats.errors})'))
              page.goto('http://127.0.0.1:8765/Luna-Raum.html');page.wait_for_timeout(2500);page.screenshot(path=str(out/f'atelier-{i}.png'))
              if page.evaluate('Luna.gpu.ready'):
                result=page.evaluate('''async()=>{const g=Luna.gpu;g.device.pushErrorScope('validation');const s=g.device.createShaderModule({code:`@vertex fn vs(@builtin(vertex_index)i:u32)->@builtin(position)vec4<f32>{let p=array<vec2<f32>,3>(vec2<f32>(-1,-1),vec2<f32>(1,-1),vec2<f32>(0,1));return vec4<f32>(p[i],0.5,1);}@fragment fn fs()->@location(0)vec4<f32>{return vec4<f32>(1,0,0,1);}`});const pipeline=await g.device.createRenderPipelineAsync({layout:'auto',vertex:{module:s,entryPoint:'vs'},fragment:{module:s,entryPoint:'fs',targets:[{format:g.format}]},primitive:{topology:'triangle-list'}});const en=g.device.createCommandEncoder(),pass=en.beginRenderPass({colorAttachments:[{view:g.context.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:1,b:0,a:1}}]});pass.setPipeline(pipeline);pass.draw(3);pass.end();g.device.queue.submit([en.finish()]);return String(await g.device.popErrorScope());}''')
                page.wait_for_timeout(100);page.screenshot(path=str(out/f'triangle-{i}.png'));print('TRIANGLE',i,result)
              b.close()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Luna-Raum-Atelier-v3-candidate
          path: candidate/
          retention-days: 7
          if-no-files-found: error
